# Apex tmux config — proper terminal type + aggressive resize
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",tmux-256color:Tc"
set -g aggressive-resize on
set -g history-limit 10000
set -g focus-events on

# Scrollback. tmux runs on the alternate screen, so xterm.js's own scrollback
# buffer is bypassed and the wheel does nothing unless tmux itself handles it.
# Without `mouse on` tmux never asks the terminal to report mouse events, so
# wheel-up never reaches it and history is unreachable from the web/iOS client.
# With it, wheel-up enters copy-mode and scrolls the 10000-line history.
# Note: this also makes click-drag select inside tmux; hold Shift (Option on
# macOS) for a native browser selection instead.
set -g mouse on
